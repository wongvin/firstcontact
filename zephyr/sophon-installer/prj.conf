# Sophon UF2 -> MCUboot installer (#294).
#
# DELIBERATELY SMALL. This application exists to replace a bootloader, and
# everything it does not need is something that could fail while it does. No
# BLE, no sensors, no USB stack of its own -- the board's defconfig already
# provides the CDC ACM console (see zephyr/CLAUDE.md, which also explains why
# adding CONFIG_USB_DEVICE_STACK here would fail at link time).

CONFIG_LOG=y

# The console is the entire user interface, and this build's whole job is to
# report what it found. Without this the report is truncated by the default
# 1024-byte buffer once the payload survey gets long.
CONFIG_LOG_BUFFER_SIZE=2048

# THIS BUILD WRITES FLASH. The survey milestone deliberately omitted the driver
# so that "writes nothing" was a property of the binary; that is no longer true,
# and the guard is now the countdown in src/main.c and the backup in ~/.sophon.
CONFIG_FLASH=y

# crc32_ieee(), for validating the MCUboot blob before it is written to 0x0.
CONFIG_CRC=y

# sys_reboot(), to hand over to the MCUboot that was just installed.
CONFIG_REBOOT=y

# No radio synchronisation, and this is the one flash setting worth arguing.
# The Sophon firmware needs SOC_FLASH_NRF_RADIO_SYNC_TICKER because it writes
# flash while a BLE link is up, and a 90 ms page erase would break it. Nothing
# here has a radio, so synchronising would only add a dependency on a subsystem
# this application does not start.
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_NONE=y

# Full-speed erases, not sliced ones. PARTIAL_ERASE exists to keep a BLE link
# alive across a page erase; with no link to protect, slicing only lengthens the
# window in which power loss is unrecoverable.
# CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE is not set

# NOT SET, and the omission is a decision:
#
#   CONFIG_BT -- the installer has no business advertising. It also must not
#   compete for the radio with anything, and a board mid-migration should not
#   look connectable.
