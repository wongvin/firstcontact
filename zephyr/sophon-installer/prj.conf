# Sophon UF2 -> MCUboot installer (#294).
#
# DELIBERATELY SMALL. This application exists to replace a bootloader, and
# everything it does not need is something that could fail while it does. No
# BLE, no sensors, no USB stack of its own -- the board's defconfig already
# provides the CDC ACM console (see zephyr/CLAUDE.md, which also explains why
# adding CONFIG_USB_DEVICE_STACK here would fail at link time).

CONFIG_LOG=y

# The console is the entire user interface, and this build's whole job is to
# report what it found. Without this the report is truncated by the default
# 1024-byte buffer once the payload survey gets long.
CONFIG_LOG_BUFFER_SIZE=2048

# NOT SET, and each omission is a decision:
#
#   CONFIG_FLASH -- this build writes nothing. Reading the staged image and the
#   trailer page needs no driver at all, because nRF52840 flash is memory
#   mapped; a pointer dereference is the read. The driver arrives with the
#   first milestone that actually erases something, so that "writes nothing"
#   is a property of the binary rather than a promise in a comment.
#
#   CONFIG_BT -- the installer has no business advertising. It also must not
#   compete for the radio with anything, and a board mid-migration should not
#   look connectable.
