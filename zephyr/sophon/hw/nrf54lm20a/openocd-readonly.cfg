# SPDX-License-Identifier: Apache-2.0
#
# READ-ONLY OpenOCD target for the XIAO nRF54LM20A (#369).
#
# For taking a backup of a board whose contents matter -- the factory image
# above all, which exists nowhere else. Nothing defined here can erase or
# write the part.
#
# WHY NOT THE BOARD'S OWN CONFIG. Zephyr's
# boards/seeed/xiao_nrf54lm20a/support/openocd.cfg installs an `examine-fail`
# handler that, if the CTRL-AP reports the part locked, runs
# `nrf54l_mass_erase` ON ITS OWN -- CTRL-AP ERASEALL, then a reset. That is the
# only way to unlock an nRF54L, and it wipes all of RRAM. So the first connect
# to a locked board would silently destroy the very image a backup exists to
# save, before a single byte had been read. `west flash` and `west debug` use
# that file, which is why neither goes near a board that has no backup.
#
# What is kept from it, unchanged: the interface, the SWD/DAP setup, the
# Cortex-M33 and AUX-AP targets, adapter speed. What is removed:
#
#   - the examine-fail handler and the procs it calls
#     (_nrf_ctrl_ap_recover, nrf54l_mass_erase)
#   - the `nrf5` flash bank, so `flash erase_*` / `flash write_image` have
#     nothing to act on
#   - nrf54lm20a-load, which turns on RRAM writes (RRAMC CONFIG.WEN)
#
# A locked part therefore just fails to examine. sophon_ctrl_ap_status below
# says why; deciding to unlock is left to a person, with the cost stated.
#
# THE PROBE. On the XIAO the USB-C goes to an onboard SAMD11 running CMSIS-DAP,
# which drives the nRF54's SWD through a level shifter (U4) whose OE is wired
# on. The nRF54's own pads, TP1 (SWCLK) / TP2 (SWDIO) / TP4 (nRESET), are the
# same nets: an external probe on them shares the bus with a live SAMD11, so
# only one probe runs a session at a time. Nothing here depends on the SAMD11
# -- a production board will not have one (NRF54LM20A-PLAN.md).
#
# USAGE -- `init` only, never `halt` or `reset` (#275): dump_image reads
# through the debug port with the core running, so a read leaves the board
# exactly as it was found.
#
#   SDK=~/zephyr-sdk-1.0.1/hosttools/opt/openocd
#   $SDK/bin/openocd -s $SDK/share/openocd/scripts \
#       -f zephyr/sophon/hw/nrf54lm20a/openocd-readonly.cfg \
#       -c "init; sophon_ctrl_ap_status; exit"
#
#   ... -c "init;
#           dump_image <prefix>_rram-2036KB.bin 0x00000000 0x1FD000;
#           dump_image <prefix>_uicr-4KB.bin    0x00FFD000 0x1000;
#           dump_image <prefix>_ficr-4KB.bin    0x00FFC000 0x1000;
#           exit"
#
# WHICH PROBE. With more than one CMSIS-DAP adapter on the Mac -- the XIAO's
# onboard SAMD11 and the external Debug Probe are both one -- OpenOCD takes the
# first it enumerates, and nothing says which that was. So the choice is made
# here, never left to enumeration order:
#
#   SOPHON_PROBE_SERIAL unset   the XIAO nRF54LM20A's onboard probe only, by
#                               VID:PID 0x2886:0x0068. A Debug Probe (0x2e8a:
#                               0x000c) is never picked up by accident.
#   SOPHON_PROBE_SERIAL=<sn>    exactly that adapter, onboard or external. The
#                               onboard serial is printed on connect
#                               ("CMSIS-DAP: Serial# = ..."); this board's is
#                               D9E2169F.
#
#   SOPHON_PROBE_SERIAL=E66... openocd ... -f openocd-readonly.cfg -c "..."
#
# An external probe on TP1/TP2/TP4 shares those nets with the SAMD11 via U4, so
# use one only with nothing else running a session -- see THE PROBE above.
#
# Set OPENOCD_INTERFACE to use a non-CMSIS-DAP adapter, as the upstream file
# allows; SOPHON_PROBE_SERIAL still applies to it, the VID:PID default does not.

if {[info exists env(OPENOCD_INTERFACE)]} {
	set INTERFACE $env(OPENOCD_INTERFACE)
} else {
	set INTERFACE "cmsis-dap"
}

source [find interface/$INTERFACE.cfg]

if {[info exists env(SOPHON_PROBE_SERIAL)] && $env(SOPHON_PROBE_SERIAL) ne ""} {
	adapter serial $env(SOPHON_PROBE_SERIAL)
	echo "sophon: probe serial $env(SOPHON_PROBE_SERIAL) (SOPHON_PROBE_SERIAL)"
} elseif {$INTERFACE eq "cmsis-dap"} {
	# OpenOCD 0.12 (Zephyr SDK 1.0.1) spells this cmsis_dap_vid_pid;
	# `cmsis-dap vid_pid` is rejected there at configuration time.
	cmsis_dap_vid_pid 0x2886 0x0068
	echo "sophon: XIAO nRF54LM20A onboard probe (0x2886:0x0068); set SOPHON_PROBE_SERIAL for another"
}

set _CHIPNAME nrf54lm20a

if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} else {
	set _CPUTAPID 0x6ba02477
}

# Multidrop instance ID should be configurable by FW in TAD TINSTANCE register.
# Writes to the register are ignored due to a silicon erratum.
if { [info exists SWD_INSTANCE_ID] } {
	set _SWD_INSTANCE_ID $SWD_INSTANCE_ID
} else {
	set _SWD_INSTANCE_ID 0
}

transport select swd

swd newdap $_CHIPNAME cpu -expected-id $_CPUTAPID

if { [info exists SWD_MULTIDROP] } {
	dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -dp-id 0x001c0289 -instance-id $_SWD_INSTANCE_ID
} else {
	dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
}

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 0

# AUX-AP, as upstream. Accessible only if CSW Prot[0] (Data Access) is set.
target create $_CHIPNAME.aux mem_ap -dap $_CHIPNAME.dap -ap-num 1
$_CHIPNAME.dap apsel 1
$_CHIPNAME.dap apcsw 0x01000000 0x01000000

adapter speed 1000

targets $_TARGETNAME

# Is the part locked? Judged by whether a memory read gets through the AHB-AP:
# CPUID at 0xE000ED00. APPROTECT blocks exactly that, and nothing else here
# needs it.
#
# NOT by CTRL-AP register 0x0C, which upstream's lock check reads (treating a
# value below 1 as locked). On this board it read 0x00000000 both while the
# part was locked AND after ERASEALL had unlocked it (#369), so it does not
# distinguish the two. Printed raw for the record, and not interpreted.
set SOPHON_CTRL_AP_NUM 2

proc sophon_ctrl_ap_status {} {
	global SOPHON_CTRL_AP_NUM
	set dap [[target current] cget -dap]
	set idr [$dap apreg $SOPHON_CTRL_AP_NUM 0xfc]
	set reg0c [$dap apreg $SOPHON_CTRL_AP_NUM 0xc]
	echo [format "CTRL-AP IDR 0x%08x (nRF54L CTRL-AP is 0x32880000), 0x0C 0x%08x (raw)" $idr $reg0c]
	if {[catch {set cpuid [read_memory 0xe000ed00 32 1]}]} {
		echo "LOCKED: memory reads are refused. Stop -- unlocking is a mass erase."
	} else {
		echo [format "unlocked: CPUID 0x%08x" $cpuid]
	}
}
add_help_text sophon_ctrl_ap_status "Read-only: is the nRF54LM20A locked? (tries a CPUID read)"
