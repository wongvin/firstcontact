# MCUboot image configuration for the XIAO (#253).
#
# SHARED BY EVERY MCU (#370). The XIAO nRF54LM20A builds MCUboot with this same
# file. The notes below were written on the nRF52840; what differs there:
#
#   - Its console needs no redirecting: the board's own console is uart20,
#     through the SAMD11 bridge, so MCUboot logs on the USB-C with no overlay.
#   - CONFIG_REGULATOR=n still applies, for the same reason: the board declares
#     a `regulator-fixed` (power_en) that would pull k_usleep into a
#     single-threaded build. It costs one harmless Kconfig warning there, since
#     that board's defconfig sets REGULATOR_FIXED_INIT_PRIORITY, which then has
#     no regulator to apply to.
#   - MCUboot measures 35,296 B of that board's 62 KB partition (55.6%).
#
# Per-MCU MCUboot devicetree (partition table, console) is in hw/<mcu>/.
#
# Picked up automatically by sysbuild for the `mcuboot` image. It exists because
# MCUboot inherits this board's devicetree while being a minimal, single-threaded
# build, and two of the board's nodes do not survive that. Both fail at LINK
# time, minutes into a build, rather than at configure time.
#
# ONE NEEDED REDIRECTING, not removing:
#
#   The board's console is USB CDC ACM -- the XIAO has no UART-to-USB bridge --
#   so `uart_console.c` links against a device ordinal that MCUboot, which never
#   brings up the USB stack, does not instantiate:
#       undefined reference to `__device_dts_ord_127'
#
#   The first fix here was CONFIG_CONSOLE=n / CONFIG_SERIAL=n. That built, and
#   cost more than it saved: MCUboot then logged nothing, so its stage of the
#   boot was invisible, and answering "how long does MCUboot take" fell back to
#   sampling the program counter over SWD -- which halts the CPU, perturbs the
#   measurement, and strands the BLE link. The console is now ON and pointed at
#   uart0 by hw/nrf52840/mcuboot-console.overlay, which needs no USB stack.
#   Cost: 992 B.
#
# ONE GENUINELY HAS TO GO:
#
#   `regulator-fixed` (the IMU's power rail) calls `k_usleep`, which does not
#   exist under CONFIG_MULTITHREADING=n:
#       undefined reference to `z_impl_k_usleep'
#
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# Logging stays at CONFIG_LOG_MODE_MINIMAL (Zephyr's default here), which drops
# timestamps -- hence `I: Starting bootloader` rather than a `[hh:mm:ss.mmm]`
# prefix. CONFIG_LOG_MODE_IMMEDIATE adds them and is a pure config change that
# builds and fits, at 43,972 B against 40,176 B: 89.5% of the 48 KB partition
# instead of 81.7%. Declined deliberately -- MCUboot is the one image where
# running out of room is expensive, since growing its partition means moving
# slot0 and reflashing both images. See BOOTLOADER.md.
CONFIG_REGULATOR=n

# No serial recovery: it would need the USB stack this build is dropping. SWD is
# the recovery path for this experiment, which is the point of #253.
CONFIG_MCUBOOT_SERIAL=n
