# Sophon -- BLE motion peripheral (#208)

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="Sophon"
# Required to replace the name at runtime with the FICR-derived one.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
# "Sophon-A3F2" is 11 chars; default 28 just wastes RAM.
CONFIG_BT_DEVICE_NAME_MAX=16

# ATT MTU is left at the default 23 deliberately -- see PROTOCOL.md. The 18-byte
# frame fits one radio packet, so no fragmentation or reassembly is needed.
# No CONFIG_BT_SMP: the link is unencrypted and does not pair.

# --- Transmit buffer pools ---
#
# Zephyr's default is 3 buffers in flight, which is the floor and was chosen for
# a stack that sends occasionally. This one notifies at ~54 Hz.
#
# The arithmetic: a sample every 18.4 ms against a connection interval iOS may
# set as high as 45 ms means up to ~2.5 samples accumulate between radio events.
# Three buffers therefore have almost no margin -- one missed connection event,
# or a concurrent read of the stats characteristic, exhausts the pool and the
# notify is refused. Measured on hardware at the default: about one refusal
# every 80 seconds over a 17-minute run (13 in 56000 frames).
#
# 8 covers two consecutive missed events plus a concurrent read. Raising the
# pool attacks the cause; the alternative -- retrying a refused frame -- only
# treats the symptom and pays for it in tail latency.
#
# Confirmed on hardware, same device and same usage on both sides so the
# comparison is like for like -- an iPad mini with the app in the foreground:
#
#   3 buffers: 13 refusals in 56000 frames (about one per 80 seconds)
#   8 buffers:  0 refusals in 84000 frames
#
# Measure this on a device that stays awake. A phone that sleeps produces
# refusals no pool size can prevent: iOS stretches the connection interval for
# power, so several samples pile up between radio events, and deep sleep drops
# the link outright and discards whatever was queued. A sleeping iPhone logged
# 26 refusals in 51000 frames on this same firmware -- that number measures
# iOS's power management, not this setting, and raising the pool will not move
# it. 8 is where the returns stop being worth the RAM.
#
# These four must move together: the smallest of them is what actually binds.
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_ATT_TX_COUNT=8
CONFIG_BT_CONN_TX_MAX=8

# Per-chip identity from the nRF52840 FICR, so one image suits every board.
CONFIG_HWINFO=y

# The XIAO has no UART-to-USB bridge, so USB CDC ACM is the only console --
# but nothing is set here for it. The board already does the whole job via
# boards/common/usb/Kconfig.cdc_acm_serial.defconfig, which turns on
# USB_DEVICE_STACK_NEXT, CDC_ACM_SERIAL_INITIALIZE_AT_BOOT, and a 4000 ms
# LOG_PROCESS_THREAD_STARTUP_DELAY_MS so the boot banner survives enumeration.
#
# Setting CONFIG_USB_DEVICE_STACK=y here links the LEGACY stack alongside the
# new one and the build fails at link time with a duplicate __device_dts_ord_*
# symbol. If that error appears, something has re-added the old stack.

CONFIG_LOG=y
CONFIG_GPIO=y

# --- IMU: LSM6DS3TR-C on I2C 0x6a, driven by st,lsm6dsl (#209) ---
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
# CONFIG_I2C is selected by the driver. CONFIG_REGULATOR is already on in the
# board defconfig, which is what brings the sensor's power rail (gpio1 8) up --
# it is regulator-boot-on, so nothing here has to sequence it.

# Data-ready trigger on gpio0 11, so sampling is paced by the sensor rather than
# by a timer that drifts against it.
#
# OWN_THREAD, not GLOBAL_THREAD: the handler does a blocking I2C read ~54 times a
# second. On the global thread that lands on the system work queue, which this
# app also uses to transmit frames, restart advertising after a disconnect, and
# summarise the transmit counters -- putting a 54 Hz blocking I2C consumer in
# front of all three delays them. A dedicated thread costs a stack and isolates
# the sampling path from the transmit path.
#
# Note the handler does NOT transmit; it hands the frame to the sysqueue. That
# separation is mandatory, not stylistic -- bt_gatt_notify() blocks with
# K_FOREVER off-sysqueue, and a blocked handler strands the data-ready line and
# kills the stream for good. See the tx_queue comment in src/main.c.
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y
# 1024 is the driver default, sized for a handler that only reads a sensor --
# which, since the notify moved to the sysqueue, is now all this one does. Kept
# at 2048 for margin over the driver's float-based unit conversion; it is 1 KB
# against 240 KB free.
CONFIG_LSM6DSL_THREAD_STACK_SIZE=2048

# ODR code 3 = 52 Hz on both channels. Not 50: the LSM6DSL's rate grid has no
# such step (12.5 / 26 / 52 / 104 ...), and 52 is the nearest. See imu.h for why
# taking the sensor's own rate beats resampling it onto a 50 Hz timer.
#
# Both channels must match -- the data-ready line is the OR of the two.
CONFIG_LSM6DSL_ACCEL_ODR=3
CONFIG_LSM6DSL_GYRO_ODR=3

# Full-scale ranges. Both are pinned by the frozen 18-byte frame, not by taste:
#
#   gyro 250 dps -- centi-deg/s in an int16 saturates at 327.67 dps, so this is
#     the largest standard range the wire format can carry. 500 would clip every
#     fast rotation into a flat top that still looks like data.
#   accel 4 g -- the wire quantises to 1 mg and the sensor resolves 0.122 mg/LSB
#     at this range, so the frame is the limit either way; the choice is purely
#     about where clipping starts. 4 g clears ordinary handling of a strapped
#     object. Raising it to 8 or 16 costs nothing on the wire.
#
# imu.c asserts both at compile time.
CONFIG_LSM6DSL_ACCEL_FS=4
CONFIG_LSM6DSL_GYRO_FS=250
