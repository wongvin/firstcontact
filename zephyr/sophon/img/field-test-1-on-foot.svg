<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Scenario 1: stationary sensor in a parked vehicle, tester on foot</title>
  <defs>
    <marker id="arrow-lora" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6fd8"/>
    </marker>
  </defs>

  <!-- background, so the drawing reads the same in dark mode -->
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f2328">Scenario 1 · Sensor parked, tester on foot</text>
  <text x="30" y="64" font-size="14" fill="#57606a">The sensor transmits from a parked vehicle; the tester walks away carrying the receiver and an iPhone.</text>

  <!-- ground -->
  <line x1="20" y1="380" x2="940" y2="380" stroke="#8c959f" stroke-width="2"/>

  <!-- parked vehicle -->
  <path d="M70,350 L70,300 Q75,286 92,284 L140,284 L175,246 Q182,240 194,240 L300,240 Q312,240 320,248 L356,284 L392,288 Q410,292 410,310 L410,350 Z" fill="#eef1f4" stroke="#57606a" stroke-width="2.5"/>
  <path d="M150,284 L182,252 L248,252 L248,284 Z" fill="#dbe7f5" stroke="#57606a" stroke-width="1.5"/>
  <path d="M258,252 L310,252 L340,284 L258,284 Z" fill="#dbe7f5" stroke="#57606a" stroke-width="1.5"/>
  <circle cx="140" cy="352" r="27" fill="#424a53"/><circle cx="140" cy="352" r="10" fill="#d0d7de"/>
  <circle cx="340" cy="352" r="27" fill="#424a53"/><circle cx="340" cy="352" r="10" fill="#d0d7de"/>
  <text x="240" y="406" font-size="13" fill="#57606a" text-anchor="middle">parked vehicle</text>

  <!-- roof antenna (magnetic mount) -->
  <rect x="232" y="232" width="22" height="8" rx="3" fill="#424a53"/>
  <line x1="243" y1="232" x2="243" y2="150" stroke="#424a53" stroke-width="4" stroke-linecap="round"/>
  <circle cx="243" cy="148" r="5" fill="#424a53"/>
  <text x="258" y="166" font-size="13" fill="#1f2328">915 MHz antenna,</text>
  <text x="258" y="182" font-size="13" fill="#1f2328">magnetic roof mount</text>

  <!-- coax into the cabin -->
  <path d="M243,240 C243,262 214,266 214,296" fill="none" stroke="#424a53" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- sensor + power pack inside -->
  <rect x="160" y="296" width="92" height="40" rx="6" fill="#fff1e5" stroke="#d1700a" stroke-width="2"/>
  <text x="206" y="313" font-size="12" font-weight="700" fill="#953800" text-anchor="middle">Sensor</text>
  <text x="206" y="328" font-size="11" fill="#953800" text-anchor="middle">Sense Plus + Wio</text>
  <rect x="270" y="300" width="70" height="32" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="305" y="320" font-size="11" fill="#1f2328" text-anchor="middle">power pack</text>
  <line x1="252" y1="316" x2="270" y2="316" stroke="#57606a" stroke-width="2"/>

  <!-- pin at the vehicle -->
  <path d="M110,236 C110,222 128,222 128,236 C128,246 119,254 119,262 C119,254 110,246 110,236 Z" fill="#cf222e"/>
  <circle cx="119" cy="236" r="4" fill="#ffffff"/>
  <text x="70" y="214" font-size="12" fill="#cf222e">pin dropped here</text>

  <!-- LoRa link -->
  <path d="M262,150 Q480,90 700,182" fill="none" stroke="#1d6fd8" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-lora)"/>
  <text x="430" y="104" font-size="15" font-weight="700" fill="#1d6fd8" text-anchor="middle">LoRa 915 MHz</text>
  <text x="430" y="124" font-size="13" fill="#1d6fd8" text-anchor="middle">preset V6 · SF7 · +22 dBm · one way</text>

  <!-- distance arrow -->
  <line x1="420" y1="430" x2="760" y2="430" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow-lora)"/>
  <text x="590" y="452" font-size="13" fill="#57606a" text-anchor="middle">walk outward and back · distance from the pin grows</text>

  <!-- tester on foot -->
  <circle cx="770" cy="214" r="17" fill="#f6f8fa" stroke="#1f2328" stroke-width="2.5"/>
  <line x1="770" y1="231" x2="770" y2="306" stroke="#1f2328" stroke-width="3"/>
  <line x1="770" y1="306" x2="748" y2="372" stroke="#1f2328" stroke-width="3"/>
  <line x1="770" y1="306" x2="794" y2="370" stroke="#1f2328" stroke-width="3"/>
  <line x1="770" y1="252" x2="740" y2="288" stroke="#1f2328" stroke-width="3"/>
  <line x1="770" y1="252" x2="822" y2="278" stroke="#1f2328" stroke-width="3"/>
  <text x="770" y="406" font-size="13" fill="#57606a" text-anchor="middle">tester</text>

  <!-- receiver in one hand -->
  <rect x="712" y="282" width="40" height="26" rx="5" fill="#e6f4ea" stroke="#1a7f37" stroke-width="2"/>
  <line x1="732" y1="282" x2="732" y2="196" stroke="#1a7f37" stroke-width="3" stroke-linecap="round"/>
  <circle cx="732" cy="194" r="4" fill="#1a7f37"/>
  <text x="704" y="292" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="end">Receiver</text>
  <text x="704" y="307" font-size="11" fill="#1a7f37" text-anchor="end">XIAO + Wio (gateway)</text>

  <!-- iPhone in the other hand -->
  <rect x="820" y="252" width="26" height="46" rx="5" fill="#1f2328"/>
  <rect x="823" y="257" width="20" height="34" rx="2" fill="#dbe7f5"/>
  <text x="856" y="264" font-size="12" font-weight="700" fill="#1f2328">iPhone</text>
  <text x="856" y="279" font-size="11" fill="#1f2328">Sophon app</text>

  <!-- USB-C power cable and BLE -->
  <path d="M742,308 C760,346 822,340 833,298" fill="none" stroke="#57606a" stroke-width="2"/>
  <text x="808" y="360" font-size="11" fill="#57606a">USB-C to USB-C</text>
  <text x="808" y="374" font-size="11" fill="#57606a">(power from the iPhone)</text>
  <path d="M752,284 Q788,236 820,262" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="794" y="238" font-size="11" font-weight="700" fill="#8250df">BLE</text>
</svg>
