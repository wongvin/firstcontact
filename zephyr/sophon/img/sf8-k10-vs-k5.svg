<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SF8 with k = 10 against k = 5, both at +22 dBm: V6b against V5b at +22 dBm</title>

  <!-- background, so the drawing reads the same in dark mode -->
  <rect width="960" height="720" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f2328">SF8 with k = 10 against k = 5, both at +22 dBm</text>
  <text x="30" y="64" font-size="14" fill="#57606a">k is samples per packet. Same range; fewer, longer packets against more, shorter ones. V5b at +22 dBm is not a preset.</text>

  <!-- ===== A: batching and latency ===== -->
  <text x="30" y="96" font-size="16" font-weight="700" fill="#1f2328">A · Samples every 18.4 ms, batched k at a time, first 400 ms (1 ms = 1.9 px)</text>
  <g font-size="11" fill="#57606a">
    <line x1="170" y1="126" x2="930" y2="126" stroke="#d0d7de"/>
    <text x="170" y="122" text-anchor="middle">0</text><text x="360" y="122" text-anchor="middle">100</text>
    <text x="550" y="122" text-anchor="middle">200</text><text x="740" y="122" text-anchor="middle">300</text>
    <text x="930" y="122" text-anchor="middle">400 ms</text>
  </g>
  <text x="30" y="144" font-size="14" font-weight="700" fill="#d9730d">k = 10 · V6b</text>
  <text x="30" y="160" font-size="11" fill="#57606a">100 ms every 184 ms</text>
  <text x="30" y="174" font-size="11" fill="#57606a">PL 138 B · 54% busy</text>
  <circle cx="170.0" cy="140" r="4" fill="#d9730d"/>
  <circle cx="205.0" cy="140" r="4" fill="#d9730d"/>
  <circle cx="239.9" cy="140" r="4" fill="#d9730d"/>
  <circle cx="274.9" cy="140" r="4" fill="#d9730d"/>
  <circle cx="309.8" cy="140" r="4" fill="#d9730d"/>
