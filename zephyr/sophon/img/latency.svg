<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Latency from start to finish: one sample from the IMU to the app</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
  </defs>

  <!-- background, so the drawing reads the same in dark mode -->
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f2328">Latency from start to finish: one sample, IMU to app</text>
  <text x="30" y="64" font-size="14" fill="#57606a">A sample waits for its batch, rides one LoRa packet, then one BLE connection event. The oldest sample in a packet waits longest.</text>
  <text x="30" y="104" font-size="16" font-weight="700" fill="#1f2328">A · The stages</text>

  <rect x="30" y="120" width="140" height="78" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
  <text x="100.0" y="142" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">IMU sample</text>
  <text x="100.0" y="160" font-size="11" fill="#57606a" text-anchor="middle">sensor</text>
  <text x="100.0" y="182" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">t = 0</text>
  <line x1="171" y1="159" x2="183" y2="159" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="184" y="120" width="140" height="78" rx="9" fill="#ffffff" stroke="#1d6fd8" stroke-width="1.8"/>
  <text x="254.0" y="142" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">Batch k samples</text>
  <text x="254.0" y="160" font-size="11" fill="#57606a" text-anchor="middle">sensor</text>
  <text x="254.0" y="182" font-size="11.5" font-weight="700" fill="#1d6fd8" text-anchor="middle">W = k × 18.4 ms</text>
  <line x1="325" y1="159" x2="337" y2="159" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="338" y="120" width="140" height="78" rx="9" fill="#ffffff" stroke="#d9730d" stroke-width="1.8"/>
  <text x="408.0" y="142" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">LoRa packet on air</text>
  <text x="408.0" y="160" font-size="11" fill="#57606a" text-anchor="middle">sensor → gateway</text>
  <text x="408.0" y="182" font-size="11.5" font-weight="700" fill="#d9730d" text-anchor="middle">Tpacket</text>
  <line x1="479" y1="159" x2="491" y2="159" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="492" y="120" width="140" height="78" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.8"/>
  <text x="562.0" y="142" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">Decode, unpack</text>
  <text x="562.0" y="160" font-size="11" fill="#57606a" text-anchor="middle">gateway</text>
  <text x="562.0" y="182" font-size="11.5" font-weight="700" fill="#8c959f" text-anchor="middle">small</text>
  <line x1="633" y1="159" x2="645" y2="159" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="646" y="120" width="140" height="78" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.8"/>
  <text x="716.0" y="142" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">BLE notify</text>
  <text x="716.0" y="160" font-size="11" fill="#57606a" text-anchor="middle">next connection event</text>
  <text x="716.0" y="182" font-size="11.5" font-weight="700" fill="#8250df" text-anchor="middle">0–15 ms</text>
  <line x1="787" y1="159" x2="799" y2="159" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="800" y="120" width="140" height="78" rx="9" fill="#ffffff" stroke="#8c959f" stroke-width="1.8"/>
  <text x="870.0" y="142" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">App draws it</text>
  <text x="870.0" y="160" font-size="11" fill="#57606a" text-anchor="middle">iPhone</text>
  <text x="870.0" y="182" font-size="11.5" font-weight="700" fill="#8c959f" text-anchor="middle">not measured</text>
  <text x="30" y="224" font-size="12" fill="#57606a">The doc's latency, W + Tpacket, runs from the sample to the gateway. The BLE hop adds up to one connection interval: the gateway asks for 15 ms</text>
  <text x="30" y="240" font-size="12" fill="#57606a">(Link Params shows what iOS granted). iOS takes about 4 notifications per event, so V6b's 10 frames need 3 events: the oldest goes first.</text>
  <text x="30" y="286" font-size="16" font-weight="700" fill="#1f2328">B · To scale: the oldest and newest sample of one packet (1 ms = 2 px)</text>
  <line x1="190.0" y1="320" x2="190.0" y2="538" stroke="#eaeef2"/>
  <text x="190.0" y="316" font-size="11" fill="#57606a" text-anchor="middle">0</text>
  <line x1="270.0" y1="320" x2="270.0" y2="538" stroke="#eaeef2"/>
  <text x="270.0" y="316" font-size="11" fill="#57606a" text-anchor="middle">40</text>
  <line x1="350.0" y1="320" x2="350.0" y2="538" stroke="#eaeef2"/>
  <text x="350.0" y="316" font-size="11" fill="#57606a" text-anchor="middle">80</text>
  <line x1="430.0" y1="320" x2="430.0" y2="538" stroke="#eaeef2"/>
  <text x="430.0" y="316" font-size="11" fill="#57606a" text-anchor="middle">120</text>
  <line x1="510.0" y1="320" x2="510.0" y2="538" stroke="#eaeef2"/>
  <text x="510.0" y="316" font-size="11" fill="#57606a" text-anchor="middle">160</text>
  <line x1="590.0" y1="320" x2="590.0" y2="538" stroke="#eaeef2"/>
  <text x="590.0" y="316" font-size="11" fill="#57606a" text-anchor="middle">200</text>
  <line x1="670.0" y1="320" x2="670.0" y2="538" stroke="#eaeef2"/>
  <text x="670.0" y="316" font-size="11" fill="#57606a" text-anchor="middle">240</text>
  <line x1="750.0" y1="320" x2="750.0" y2="538" stroke="#eaeef2"/>
  <text x="750.0" y="316" font-size="11" fill="#57606a" text-anchor="middle">280</text>
  <line x1="830.0" y1="320" x2="830.0" y2="538" stroke="#eaeef2"/>
  <text x="830.0" y="316" font-size="11" fill="#57606a" text-anchor="middle">320 ms</text>
  <text x="30" y="354" font-size="13" font-weight="700" fill="#1f2328">V3b</text>
  <text x="30" y="370" font-size="11" fill="#57606a">k = 2 · SF7</text>
  <rect x="190.0" y="340" width="73.6" height="20" fill="#1d6fd8" fill-opacity="1"/>
  <text x="194.0" y="354" font-size="10.5" fill="#ffffff">batch 37</text>
  <rect x="263.6" y="340" width="38.6" height="20" fill="#d9730d" fill-opacity="1"/>
  <rect x="302.2" y="340" width="30.0" height="20" fill="#8250df" fill-opacity="0.35"/>
  <text x="338.2" y="354" font-size="11.5" font-weight="700" fill="#1f2328">oldest 56–71 ms</text>
  <rect x="226.8" y="366" width="36.8" height="12" fill="#1d6fd8" fill-opacity="0.5"/>
  <rect x="263.6" y="366" width="38.6" height="12" fill="#d9730d" fill-opacity="0.5"/>
  <rect x="302.2" y="366" width="30.0" height="12" fill="#8250df" fill-opacity="0.2"/>
  <text x="338.2" y="376" font-size="10.5" fill="#57606a">newest 38–53 ms</text>
  <text x="30" y="420" font-size="13" font-weight="700" fill="#1f2328">V6 (default)</text>
  <text x="30" y="436" font-size="11" fill="#57606a">k = 4 · SF7</text>
  <rect x="190.0" y="406" width="147.2" height="20" fill="#1d6fd8" fill-opacity="1"/>
  <text x="194.0" y="420" font-size="10.5" fill="#ffffff">batch 74</text>
  <rect x="337.2" y="406" width="56.4" height="20" fill="#d9730d" fill-opacity="1"/>
  <text x="341.2" y="420" font-size="10.5" fill="#ffffff">air 28</text>
  <rect x="393.6" y="406" width="30.0" height="20" fill="#8250df" fill-opacity="0.35"/>
  <text x="429.6" y="420" font-size="11.5" font-weight="700" fill="#1f2328">oldest 102–117 ms</text>
  <rect x="300.4" y="432" width="36.8" height="12" fill="#1d6fd8" fill-opacity="0.5"/>
  <rect x="337.2" y="432" width="56.4" height="12" fill="#d9730d" fill-opacity="0.5"/>
  <rect x="393.6" y="432" width="30.0" height="12" fill="#8250df" fill-opacity="0.2"/>
  <text x="429.6" y="442" font-size="10.5" fill="#57606a">newest 47–62 ms</text>
  <text x="30" y="486" font-size="13" font-weight="700" fill="#1f2328">V6b</text>
  <text x="30" y="502" font-size="11" fill="#57606a">k = 10 · SF8</text>
  <rect x="190.0" y="472" width="368.0" height="20" fill="#1d6fd8" fill-opacity="1"/>
  <text x="194.0" y="486" font-size="10.5" fill="#ffffff">batch 184</text>
  <rect x="558.0" y="472" width="200.0" height="20" fill="#d9730d" fill-opacity="1"/>
  <text x="562.0" y="486" font-size="10.5" fill="#ffffff">air 100</text>
  <rect x="758.0" y="472" width="30.0" height="20" fill="#8250df" fill-opacity="0.35"/>
  <text x="794.0" y="486" font-size="11.5" font-weight="700" fill="#1f2328">oldest 284–299 ms</text>
  <rect x="521.2" y="498" width="36.8" height="12" fill="#1d6fd8" fill-opacity="0.5"/>
  <rect x="558.0" y="498" width="200.0" height="12" fill="#d9730d" fill-opacity="0.5"/>
  <rect x="758.0" y="498" width="90.0" height="12" fill="#8250df" fill-opacity="0.2"/>
  <text x="854.0" y="508" font-size="10.5" fill="#57606a">newest 148–163 ms</text>
  <rect x="30" y="540" width="14" height="12" fill="#1d6fd8"/><text x="50" y="550" font-size="12" fill="#1f2328">waiting for the batch</text>
  <rect x="210" y="540" width="14" height="12" fill="#d9730d"/><text x="230" y="550" font-size="12" fill="#1f2328">on air</text>
  <rect x="300" y="540" width="14" height="12" fill="#8250df" fill-opacity="0.35"/><text x="320" y="550" font-size="12" fill="#1f2328">BLE: 0–15 ms, depending on where the connection event falls</text>
  <text x="30" y="574" font-size="12" fill="#57606a">Thin bars: the newest sample, which waits one sample period, not k. Batching dominates at k = 10; at k = 2 the air and BLE share matter as much.</text>
  <text x="30" y="590" font-size="12" fill="#57606a">Computed from § LoRa variables, not measured; the bench latency measurement is pending (§ Walk-test results). The flush timer (W + 20 ms) bounds a stalled IMU.</text>
</svg>
