<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Scenario 2: sensor in a building, receiver in a moving vehicle</title>
  <defs>
    <marker id="arrow-lora2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6fd8"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- background, so the drawing reads the same in dark mode -->
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f2328">Scenario 2 · Sensor in a building, receiver in a moving vehicle</text>
  <text x="30" y="64" font-size="14" fill="#57606a">The sensor transmits from indoors; the tester drives away with the receiver in the vehicle.</text>

  <!-- ground -->
  <line x1="20" y1="380" x2="940" y2="380" stroke="#8c959f" stroke-width="2"/>

  <!-- building -->
  <rect x="40" y="110" width="250" height="270" fill="#f6f8fa" stroke="#57606a" stroke-width="2.5"/>
  <path d="M30,112 L165,84 L300,112" fill="none" stroke="#57606a" stroke-width="2.5"/>
  <line x1="40" y1="245" x2="290" y2="245" stroke="#d0d7de" stroke-width="2"/>
  <rect x="200" y="140" width="60" height="70" fill="#dbe7f5" stroke="#57606a" stroke-width="2"/>
  <line x1="230" y1="140" x2="230" y2="210" stroke="#57606a" stroke-width="1.5"/>
  <text x="165" y="406" font-size="13" fill="#57606a" text-anchor="middle">building</text>

  <!-- computer -->
  <rect x="62" y="150" width="78" height="52" rx="4" fill="#1f2328"/>
  <rect x="67" y="155" width="68" height="42" rx="2" fill="#dbe7f5"/>
  <rect x="94" y="202" width="14" height="10" fill="#57606a"/>
  <rect x="78" y="212" width="46" height="5" rx="2" fill="#57606a"/>
  <text x="101" y="234" font-size="11" fill="#1f2328" text-anchor="middle">computer</text>

  <!-- sensor by the window -->
  <rect x="146" y="176" width="48" height="30" rx="5" fill="#fff1e5" stroke="#d1700a" stroke-width="2"/>
  <text x="170" y="195" font-size="11" font-weight="700" fill="#953800" text-anchor="middle">Sensor</text>
  <line x1="186" y1="176" x2="186" y2="118" stroke="#d1700a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="186" cy="116" r="4" fill="#d1700a"/>
  <path d="M140,192 L146,192" stroke="#57606a" stroke-width="2"/>
  <text x="143" y="270" font-size="11" fill="#57606a" text-anchor="middle">USB from the computer</text>
  <text x="143" y="284" font-size="11" fill="#57606a" text-anchor="middle">(power + console)</text>
  <text x="200" y="232" font-size="11" fill="#953800">antenna at the window</text>

  <!-- pin at the building -->
  <path d="M64,312 C64,298 82,298 82,312 C82,322 73,330 73,338 C73,330 64,322 64,312 Z" fill="#cf222e"/>
  <circle cx="73" cy="312" r="4" fill="#ffffff"/>
  <text x="90" y="318" font-size="12" fill="#cf222e">pin dropped here</text>

  <!-- LoRa link -->
  <path d="M262,172 Q470,140 652,190" fill="none" stroke="#1d6fd8" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-lora2)"/>
  <text x="460" y="112" font-size="15" font-weight="700" fill="#1d6fd8" text-anchor="middle">LoRa 915 MHz</text>
  <text x="460" y="132" font-size="13" fill="#1d6fd8" text-anchor="middle">preset V6 · SF7 · +22 dBm · one way</text>

  <!-- moving vehicle -->
  <path d="M560,350 L560,300 Q565,286 582,284 L630,284 L665,246 Q672,240 684,240 L790,240 Q802,240 810,248 L846,284 L882,288 Q900,292 900,310 L900,350 Z" fill="#eef1f4" stroke="#57606a" stroke-width="2.5"/>
  <path d="M640,284 L672,252 L738,252 L738,284 Z" fill="#dbe7f5" stroke="#57606a" stroke-width="1.5"/>
  <path d="M748,252 L800,252 L830,284 L748,284 Z" fill="#dbe7f5" stroke="#57606a" stroke-width="1.5"/>
  <circle cx="630" cy="352" r="27" fill="#424a53"/><circle cx="630" cy="352" r="10" fill="#d0d7de"/>
  <circle cx="830" cy="352" r="27" fill="#424a53"/><circle cx="830" cy="352" r="10" fill="#d0d7de"/>
  <line x1="510" y1="300" x2="545" y2="300" stroke="#8c959f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="500" y1="318" x2="545" y2="318" stroke="#8c959f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="515" y1="336" x2="545" y2="336" stroke="#8c959f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- roof antenna -->
  <rect x="682" y="232" width="22" height="8" rx="3" fill="#424a53"/>
  <line x1="693" y1="232" x2="693" y2="160" stroke="#424a53" stroke-width="4" stroke-linecap="round"/>
  <circle cx="693" cy="158" r="5" fill="#424a53"/>
  <text x="708" y="176" font-size="13" fill="#1f2328">915 MHz antenna,</text>
  <text x="708" y="192" font-size="13" fill="#1f2328">magnetic roof mount</text>
  <path d="M693,240 C693,262 668,266 668,296" fill="none" stroke="#424a53" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- receiver + power pack inside -->
  <rect x="614" y="296" width="96" height="40" rx="6" fill="#e6f4ea" stroke="#1a7f37" stroke-width="2"/>
  <text x="662" y="313" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">Receiver</text>
  <text x="662" y="328" font-size="11" fill="#1a7f37" text-anchor="middle">XIAO + Wio</text>
  <rect x="724" y="300" width="70" height="32" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="759" y="320" font-size="11" fill="#1f2328" text-anchor="middle">power pack</text>
  <line x1="710" y1="316" x2="724" y2="316" stroke="#57606a" stroke-width="2"/>

  <!-- phone on a dash mount -->
  <rect x="818" y="256" width="22" height="36" rx="4" fill="#1f2328"/>
  <rect x="821" y="260" width="16" height="26" rx="2" fill="#dbe7f5"/>
  <text x="922" y="226" font-size="12" font-weight="700" fill="#1f2328" text-anchor="end">iPhone, mounted</text>
  <text x="922" y="241" font-size="11" fill="#1f2328" text-anchor="end">Sophon app</text>
  <path d="M712,302 Q770,262 816,272" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="766" y="296" font-size="11" font-weight="700" fill="#8250df" text-anchor="middle">BLE</text>
  <text x="730" y="406" font-size="13" fill="#57606a" text-anchor="middle">tester drives; vehicle moving</text>

  <!-- distance arrow -->
  <line x1="300" y1="430" x2="900" y2="430" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="600" y="452" font-size="13" fill="#57606a" text-anchor="middle">drive outward and back · distance from the pin grows</text>
</svg>
