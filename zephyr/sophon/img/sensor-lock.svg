  <text x="575.7" y="564" font-size="10.5" fill="#57606a" text-anchor="end">released: 5 s without its trailer</text>
  <text x="733.7" y="583" font-size="10.5" fill="#cf222e" text-anchor="middle">heard, dropped (unlocked)</text>
  <line x1="296.7" y1="630" x2="765.3" y2="630" stroke="#cf222e" stroke-width="1.5"/>
  <text x="531.0" y="646" font-size="11.5" fill="#cf222e" text-anchor="middle">all counted as missing once the trailer at 9.4 s relocks the same sensor</text>
  <text x="30" y="676" font-size="12" fill="#57606a">Packets that get through after the fade but before the next status trailer are thrown away as wrong peer, and their samples count as missing.</text>
  <text x="30" y="692" font-size="12" fill="#57606a">With peer any. On the 2026-10-24 walk that was 171 of the sensor's own packets. From 2.38.0 a configured peer keeps them,</text>
  <text x="30" y="708" font-size="12" fill="#57606a">and a walk-test recording sets the peer for its length (#360).</text>
