# Sophon on the XIAO nRF54LM20A Sense: board-specific Kconfig (#370), merged on
# top of prj.conf by Zephyr for this board only.

# --- RRAM writes time out while a BLE link is up -------------------------------
#
# With Zephyr's own controller (BT_LL_SW_SPLIT) the RRAM driver synchronises
# every write with the radio (SOC_FLASH_NRF_RADIO_SYNC_TICKER), and its write
# buffer then defaults to ONE 128-bit line. That sets the radio slot it asks for
# to FLASH_SLOT_WRITE = 500 us (soc_flash_nrf_rram.c). The ticker backend
# (subsys/bluetooth/controller/flash/soc_flash_nrf_ticker.c) sets the slot
# interval to that duration minus FLASH_SYNC_SWITCHING_TIME, 1500 + 200 =
# 1700 us -- and 500 - 1700 underflows a uint32_t. The first slot runs; the next
# is scheduled impossibly far away; and on the nRF54L each slot writes a single
# line, so any write longer than one line never finishes and fails after
# FLASH_TIMEOUT_MS (42 ms x 381 pages x 1.5 = ~24 s) with -ETIMEDOUT.
#
# Seen on Sophon-F9B0 (#370): an MCUmgr image upload over BLE failed at its
# first flush, `flash_write error -116 offset=0x00103000`, 25 s in. Anything
# that writes RRAM while connected -- OTA, and the config record -- hits it.
#
# 32 lines, the maximum, gives an 8000 us slot and a 6300 us interval. With it
# the same upload took 22 s and the full test / revert / confirm cycle passed.
# Reported upstream with the other board findings (#375, #376); remove this
# once the driver or the ticker handles short slots.
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32
