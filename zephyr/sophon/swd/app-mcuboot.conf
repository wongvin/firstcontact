# Sophon application settings for MCUboot builds ONLY.
#
# scripts/build.sh adds this with -DEXTRA_CONF_FILE in its MCUboot branch,
# alongside swd/app-slot0.overlay, the other app-only MCUboot file. It is not
# in prj.conf because the image manager needs a slot0_partition, which only
# swd/mcuboot-partitions.overlay defines: from #271 until #306 this block sat in
# prj.conf, and every UF2 build failed to compile.
#
# A UF2 board has no use for any of it: OTA here means MCUboot's swap and
# rollback, and a UF2 board is updated by UF2 instead.

# --- MCUmgr: SMP over BLE, for OTA with rollback (#271) ---
#
# MCUboot already validates every image and the swap machinery is present; what
# was missing was a way to deliver an image without a probe. This is that.
#
# NOTE the naming trap, because the two are one letter apart in this file:
# CONFIG_BT_SMP above is Bluetooth's Security Manager Protocol, which Sophon
# deliberately does not use. MCUmgr's SMP is the Simple Management Protocol and
# is unrelated to it.
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Reassembly is NOT a throughput optimisation here -- it is a precondition.
#
# At the default 23-byte ATT MTU an ATT write carries 20 bytes, and the 8-byte
# SMP header leaves 12 for the entire CBOR body. An img-upload request has to
# carry `off`, `len`, a 32-byte `sha` and `data`; the map keys alone do not fit.
# Without reassembly the first request cannot be encoded at all.
#
# MCUMGR_PARAMS is its other half: it is how the client learns the buffer
# geometry, and therefore that it may write a packet larger than the MTU.
# Reassembly without it is not usable.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# Flash write path. IMG_MANAGER is what gives boot_write_img_confirmed() its
# meaning, so it is the difference between rollback and a one-way update.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# THE SETTING THAT KEEPS THE LINK ALIVE.
#
# With Zephyr's controller the flash driver is radio-synchronised, and a page
# erase on this part blocks for FLASH_PAGE_ERASE_MAX_TIME_US = 89,700 us. That is
# six connection events at a 15 ms interval and 21% of Sophon's 420 ms
# supervision timeout -- on each of the ~42 pages a 169 KB image spans.
#
# Partial erase slices it at SOC_FLASH_NRF_PARTIAL_ERASE_MS (3) so it fits
# between connection events. Without this the link drops during the upload that
# is meant to be delivering the image.
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y

# Request a tighter interval while SMP packets are moving, then fall back.
#
# ITS DEFAULTS ARE WRONG FOR AN APPLE CENTRAL and must be overridden: MIN_INT=6 /
# MAX_INT=9 is 7.5-11.25 ms, which breaks Apple's accessory rules on two counts
# (interval min >= 15 ms, and max >= min + 15 ms). iOS rejects the update, and
# ..._RETRY_TIME re-requests every second for the whole upload. 12/24 is
# 15 ms/30 ms, which is inside the rules.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MIN_INT=12
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MAX_INT=24

# Some SMP handlers need more stack than the defaults this app has run on.
# Taken from Zephyr's own smp_svr sample rather than guessed.
CONFIG_MAIN_STACK_SIZE=2176
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
