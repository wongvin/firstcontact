# Sophon flash dumper (#297).
#
# Reads the whole chip out over the CDC ACM console so a board can be backed up
# without a probe, which is the contradiction #294 left behind: a probe-free
# migration whose first instruction was "attach a probe".
#
# THIS APPLICATION WRITES NOTHING, and `CONFIG_FLASH` is deliberately absent so
# that is a property of the binary rather than a promise in a comment. It needs
# no flash driver at all: nRF52840 flash and UICR are memory mapped, so a read
# is a pointer dereference.

CONFIG_PRINTK=y

# crc32_ieee(), per chunk and per region. A backup that cannot be verified is
# not a backup, and this is the only integrity signal the host will get.
CONFIG_CRC=y

# Device id for the filename, from FICR. The same source src/ident.c uses in the
# firmware, and the reason a dump can name itself.
CONFIG_HWINFO=y

# NOT SET, and each omission is a decision:
#
#   CONFIG_LOG -- the dump IS the output. Log formatting would prefix every
#   line with a timestamp and a module name, and the bulk path wants printk
#   straight to the console.
#
#   CONFIG_BT -- a board being backed up has no business advertising.

# NOT USBD_CDC_ACM_BUF_POOL_SIZE. It was tried, and it is inert here: it depends
# on USBD_CDC_ACM_BUF_POOL=y, which this board's USB stack leaves off, so
# Kconfig accepted the line and discarded the value. A bigger buffer would only
# move where an unpaced dumper overflows in any case -- the pacing in
# src/main.c is the actual fix.
